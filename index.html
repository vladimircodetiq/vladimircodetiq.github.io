<!doctype html>
<!--
  Cross-site embed test host for the GS Data Backbone SPA.

  Stands in for a client's application: a foreign top-level origin that frames
  vibe.codetiq.io and hands it an Entra access token over postMessage. Copy this file to
  the static host you are testing from (e.g. the vladimircodetiq.github.io repo, as
  index.html) -- it has no build step and no dependencies.

  The handshake it implements is the host half of frontend/src/auth/hostToken.ts. Every
  message is an envelope { ns: "gsdb", v: 1, type, payload }:

      SPA  -> host: ready                 loaded, wants a token
                    token-request {reason} what it holds is expiring -- send a fresh one
                    auth-required {reason} asked, nobody answered; only you can fix it
                    navigation {path}      where the user just went
                    resize {height}        its content height
      host -> SPA:  token {token}          replaces whatever it holds, no reload
                    token-unavailable      you cannot supply one right now
                    navigate {path}        show this route, e.g. /preview/42

  Note for a deployed SPA: it only accepts messages from the origins its build names
  (VITE_HOST_ORIGINS, from extra_frame_ancestors in stages/config.py). Serving this page
  from an origin that is not in that list gets you a frame that renders -- or not, since
  the same list drives the frame-ancestors CSP -- and ignores everything you send it.

  The host may push a fresh token at any time; the SPA swaps it in without reloading. A
  token for a *different user* is not a renewal -- the SPA drops the previous user's
  screens and starts over, which the "Push token" button lets you try.

  Getting a token to paste: open https://vibe.codetiq.io top-level, sign in, and copy the
  `token=` value off the Appsmith iframe request in DevTools -> Network (or the
  `authorization: Bearer` header on any /apps call). They last ~60 minutes -- this page
  shows the countdown so an expired one is obvious rather than looking like a bug.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GSDB embed host (test)</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f4f5f7;
        color: #14181f;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        flex: none;
        background: #fff;
        border-bottom: 1px solid #e3e6ea;
        padding: 12px 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-start;
      }
      h1 { font-size: 13px; margin: 0 12px 0 0; align-self: center; white-space: nowrap; }
      textarea {
        flex: 1 1 340px;
        min-width: 240px;
        height: 60px;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 7px 9px;
        border: 1px solid #d5d9df;
        border-radius: 6px;
        resize: vertical;
      }
      input[type="text"] {
        flex: 0 1 160px;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 7px 9px;
        border: 1px solid #d5d9df;
        border-radius: 6px;
      }
      input[type="url"] {
        flex: 0 1 260px;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 7px 9px;
        border: 1px solid #d5d9df;
        border-radius: 6px;
      }
      .controls { display: flex; flex-direction: column; gap: 6px; }
      button {
        font: 600 12.5px inherit;
        padding: 7px 13px;
        border-radius: 6px;
        border: 1px solid transparent;
        background: #2d6cdf;
        color: #fff;
        cursor: pointer;
      }
      button.secondary { background: #fff; color: #2d3642; border-color: #d5d9df; }
      button:disabled { opacity: 0.5; cursor: default; }
      #log {
        flex: 0 0 auto;
        max-height: 96px;
        overflow: auto;
        margin: 0;
        padding: 8px 16px;
        background: #10141b;
        color: #b9c4d2;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
      }
      #log .warn { color: #ffcf6b; }
      #frame-wrap { flex: 1; min-height: 0; }
      iframe { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
    </style>
  </head>
  <body>
    <header>
      <h1>Embed host (test)</h1>
      <textarea id="token" placeholder="Paste an Entra access token (eyJ...)" spellcheck="false"></textarea>
      <input id="src" type="url" value="https://vibe.codetiq.io/" aria-label="SPA URL" />
      <div class="controls">
        <button id="load">Load iframe</button>
        <button id="push" class="secondary" disabled>Push token (no reload)</button>
      </div>
      <div class="controls">
        <input id="path" type="text" value="/" aria-label="Route to ask the SPA for" />
        <button id="go" class="secondary" disabled>Send navigate</button>
      </div>
    </header>
    <pre id="log"></pre>
    <div id="frame-wrap"></div>

    <script>
      const NS = "gsdb";
      const V = 1;
      // SPA -> host
      const READY = "ready";
      const TOKEN_REQUEST = "token-request";
      const AUTH_REQUIRED = "auth-required";
      const NAVIGATION = "navigation";
      const RESIZE = "resize";
      // host -> SPA
      const TOKEN = "token";
      const TOKEN_UNAVAILABLE = "token-unavailable";
      const NAVIGATE = "navigate";

      const $ = (id) => document.getElementById(id);
      const logEl = $("log");
      let token = "";
      let spaOrigin = "";
      let frame = null;

      function log(msg, warn) {
        const line = document.createElement("div");
        if (warn) line.className = "warn";
        line.textContent = new Date().toLocaleTimeString() + "  " + msg;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }

      // Decoded only to show the user how long they have left -- the SPA and the backend
      // are what actually validate this token.
      function expiryOf(jwt) {
        try {
          const exp = JSON.parse(atob(jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).exp;
          return typeof exp === "number" ? new Date(exp * 1000) : null;
        } catch {
          return null;
        }
      }

      function describeToken(jwt) {
        const exp = expiryOf(jwt);
        if (!exp) return "token accepted (could not read exp -- is it a JWT?)";
        const mins = Math.round((exp.getTime() - Date.now()) / 60000);
        return mins > 0
          ? `token accepted, expires in ${mins} min (${exp.toLocaleTimeString()})`
          : `token EXPIRED ${-mins} min ago (${exp.toLocaleTimeString()}) -- get a fresh one`;
      }

      // Always targeted at the SPA's exact origin, never "*": this message carries the
      // access token, so it must not be readable by whatever else might occupy the frame.
      function send(type, payload) {
        if (!frame || !spaOrigin) return;
        frame.contentWindow.postMessage({ ns: NS, v: V, type, payload }, spaOrigin);
        log("-> " + type + " to " + spaOrigin);
      }

      function push() {
        if (!token) {
          send(TOKEN_UNAVAILABLE, { reason: "no token pasted in the test host" });
          return;
        }
        send(TOKEN, { token });
      }

      // Registered before the iframe is ever created, so the SPA's first ready ping (sent
      // at load, before React renders) cannot arrive with nobody listening.
      window.addEventListener("message", (e) => {
        if (!frame || e.source !== frame.contentWindow) return;
        const msg = e.data;
        if (!msg || msg.ns !== NS || msg.v !== V) return;
        const reason = (msg.payload && msg.payload.reason) || "";

        if (msg.type === READY) {
          log("<- " + READY + " from " + e.origin);
          if (token) push();
          else log("   ...but no token pasted yet; paste one and press Push token", true);
          return;
        }
        if (msg.type === TOKEN_REQUEST) {
          // A real host would acquire a fresh token here (MSAL acquireTokenSilent) and
          // send that. This one can only re-send whatever is in the textarea, so paste a
          // fresh token first -- and watch for auth-required if you do not.
          log("<- " + TOKEN_REQUEST + " (" + reason + ")");
          token = $("token").value.trim();
          if (token) log("   " + describeToken(token));
          push();
          return;
        }
        if (msg.type === NAVIGATION) {
          // Where the SPA is now. A real host would put this in its own URL so a reload
          // lands back on the same dashboard. Do NOT echo it back as `navigate`: the SPA
          // suppresses the report for a route you asked for, but a blind echo of every
          // other navigation would still fight the user.
          log("<- " + NAVIGATION + " " + (msg.payload && msg.payload.path));
          $("path").value = (msg.payload && msg.payload.path) || "/";
          return;
        }
        if (msg.type === RESIZE) {
          // A host that gives the frame a fixed height (as this page does) can ignore this.
          log("<- " + RESIZE + " " + (msg.payload && msg.payload.height) + "px");
          return;
        }
        if (msg.type === AUTH_REQUIRED) {
          // The SPA asked, nobody answered in time. It is now showing "your session has
          // expired" and will not recover until a token arrives.
          log("<- " + AUTH_REQUIRED + " (" + reason + ") -- the SPA is blocked", true);
        }
      });

      $("load").addEventListener("click", () => {
        token = $("token").value.trim();
        const url = $("src").value.trim();
        try {
          spaOrigin = new URL(url).origin;
        } catch {
          log("that SPA URL does not parse", true);
          return;
        }
        if (!token) log("no token pasted -- the SPA will show its own sign-in screen", true);
        else log(describeToken(token), (expiryOf(token) || 0) && expiryOf(token) < new Date());

        const wrap = $("frame-wrap");
        wrap.textContent = "";
        frame = document.createElement("iframe");
        // Deliberately no sandbox attribute: the SPA needs same-origin storage, scripts and
        // its own nested Appsmith iframe, which a default sandbox would all deny.
        frame.src = url;
        frame.title = "GS Data Backbone - Report Generator";
        wrap.appendChild(frame);
        $("push").disabled = false;
        $("go").disabled = false;
        log("iframe -> " + url);
      });

      $("go").addEventListener("click", () => {
        const path = $("path").value.trim();
        if (!path.startsWith("/")) {
          log("navigate takes an in-app path, e.g. /preview/42", true);
          return;
        }
        send(NAVIGATE, { path });
      });

      $("push").addEventListener("click", () => {
        token = $("token").value.trim();
        if (!token) {
          log("nothing to push -- paste a token first", true);
          return;
        }
        log(describeToken(token));
        push();
      });
    </script>
  </body>
</html>
